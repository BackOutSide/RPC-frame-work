name: rpc-dianping

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dianping-local-root
      MYSQL_DATABASE: dianping
      MYSQL_USER: dianping
      MYSQL_PASSWORD: dianping
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'mysql --protocol=TCP -h127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 2s
      retries: 20

  zookeeper:
    image: zookeeper:3.8
    ports:
      - "127.0.0.1:12181:2181"
    healthcheck:
      test: [CMD-SHELL, 'zkServer.sh status 2>/dev/null | grep -Eq "Mode:"']
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
  redis-data:
