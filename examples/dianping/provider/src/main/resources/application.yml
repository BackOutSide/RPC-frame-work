server:
  address: ${PROVIDER_HTTP_BIND_HOST:127.0.0.1}
  port: ${PROVIDER_HTTP_PORT:18081}

spring:
  application:
    name: dianping-provider
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/${MYSQL_DATABASE:dianping}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${MYSQL_USER:dianping}
    password: ${MYSQL_PASSWORD:dianping}
  data:
    redis:
      host: ${DIANPING_REDIS_HOST:127.0.0.1}
      port: ${DIANPING_REDIS_PORT:16379}
      connect-timeout: 2s
      timeout: 2s
  flyway:
    enabled: true

rpc:
  zk:
    address: ${DIANPING_ZK_ADDRESS:127.0.0.1:12181}
  server:
    bind-host: ${RPC_BIND_HOST:127.0.0.1}
    advertise-host: ${RPC_ADVERTISE_HOST:127.0.0.1}
    port: ${RPC_SERVER_PORT:19998}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
