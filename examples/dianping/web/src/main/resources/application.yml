server:
  address: ${DIANPING_WEB_BIND_HOST:127.0.0.1}
  port: ${DIANPING_WEB_PORT:18080}

spring:
  data:
    redis:
      host: ${DIANPING_REDIS_HOST:127.0.0.1}
      port: ${DIANPING_REDIS_PORT:16379}
      connect-timeout: 2s
      timeout: 2s

rpc:
  zk:
    address: ${DIANPING_ZK_ADDRESS:127.0.0.1:12181}
  client:
    timeout-ms: ${DIANPING_RPC_TIMEOUT_MS:3000}
    connect-timeout-ms: ${DIANPING_RPC_CONNECT_TIMEOUT_MS:5000}
    load-balance: ${DIANPING_RPC_LOAD_BALANCE:random}

dianping:
  demo-users:
    session-ttl: 30m
    accounts:
      alice:
        id: 1
        password: ${DIANPING_ALICE_PASSWORD:demo-alice}
      bob:
        id: 2
        password: ${DIANPING_BOB_PASSWORD:demo-bob}
